#         id: "session.sign_out"
#         target: "session_action"
#         outcomes: [breakpoint_available, session_absence_after_action]
#       command: "npm run test:mobile-session-action"

scan:
  source_dirs:
    - "src/"
    - "src-tauri/src/"
    - "src-tauri/tests/"
    - "benchmarks/architecture-spike/"
    - "scripts/"
    - "tests/fixtures/"
  test_dirs:
    - "tests/"
  doc_dirs:
    - "docs/"
  config_files:
    - "package.json"
    - "package-lock.json"
    - "tsconfig.json"
    - "vite.config.ts"
    - "src-tauri/Cargo.toml"
    - "src-tauri/Cargo.lock"
    - "src-tauri/tauri.conf.json"
    - ".github/workflows/architecture-spike.yml"
    - ".github/workflows/product-quality.yml"
  exclude:
    - "**/node_modules/**"
    - "**/__pycache__/**"
    - "**/dist/**"

graph:
  store: "jsonl"
  path: "codd/scan"

bands:
  green:
    min_confidence: 0.90
    min_evidence_count: 2
  amber:
    min_confidence: 0.50

propagation:
  max_depth: 10
  stop_at_contract_boundary: true

typecheck:
  enabled: true
  command: "python -X utf8 scripts/run-typecheck.py"
  max_repair_attempts: 3

verify:
  # Frozen dependency installation is enforced by product-quality.yml.
  # CoDD's built-in preflight hard-codes `npm ci`; verification instead runs the
  # lock-backed project runner and the separately enabled typecheck gate below.
  install_preflight: false
  test_command: "python -X utf8 scripts/run-tests.py"
#   verification_timeout:
#     per_node_seconds: 60    # optional: hard cap for each verification_test node
#     total_seconds: 300      # optional: total budget for all verification_test nodes

ci:
  provider: github_actions   # github_actions | gitlab_ci | none
  # GitHub Actions loads BOTH .yml and .yaml; the default spans both (comma-
  # separated union). Narrow to a single pattern to scope to one extension.
  workflow_glob: .github/workflows/*.yml,.github/workflows/*.yaml
  required_triggers:
    - push
    - pull_request
  runtime_check: false       # opt-in (v2.13.0)
  staleness_days: 14
  default_branch: main

