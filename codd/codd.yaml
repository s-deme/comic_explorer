# CoDD プロジェクト設定
version: "0.1.0"
codd_required_version: null
codd_required_version_strict: false

project:
  name: "comic_explorer"
  # CoDD has no desktop profile; generic is the correct mixed TypeScript/Rust
  # profile for a Tauri application.
  type: "generic"
  language: "typescript"
  frameworks:
    - "tauri"
    - "react"

dag:
  enabled_checks:
    - "node_completeness"
    - "edge_validity"
    - "depends_on_consistency"
    - "dependency_freshness"
    - "task_completion"
    - "transitive_closure"
    - "source_completeness"
    - "unresolved_import_residue"
  implementation_suffixes_extend:
    - ".css"
  import_aliases:
    architecture_spike_runner:
      - "benchmarks/architecture-spike/run_foundation_benchmark.py"
  impl_file_patterns:
    - "vite.config.ts"
    - "src-tauri/build.rs"
  test_file_patterns:
    - "src/**/*.test.ts"
    - "src/**/*.test.tsx"
    - "src-tauri/tests/**/*.rs"

common_node_patterns:
  - "vite.config.ts"
  - "src-tauri/build.rs"
  - "tests/fixtures/**"

ai_command: "codex exec --sandbox workspace-write --ask-for-approval never -"

# codex_app_server:
#   enabled: false
#   transport: stdio
#   thread_strategy: per_session
#   effort: xhigh
#   model: gpt-5.5
#   timeout_seconds: 300
#   fallback: subprocess
coding_principles: null

