# Project type (drives capability-aware generation: UI, network surface,
# e2e modality). Profiles: codd/required_artifacts/defaults/*.yaml.
required_artifacts:
  # CoDD has no desktop profile. generic avoids web-server/API requirements
  # while Tauri/React-specific artifacts are declared above.
  project_type: "generic"
