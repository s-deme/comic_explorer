[package]
name = "comic-explorer"
version = "0.1.0"
description = "Offline comic library explorer for Windows"
authors = ["Comic Explorer contributors"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "comic_explorer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
delharc = { version = "=0.6.2", default-features = false, features = ["std", "lh1", "lz"] }
image = { version = "=0.25.9", default-features = false, features = ["bmp", "gif", "ico", "png", "tiff"] }
image-webp = "=0.2.4"
resvg = { version = "=0.45.1", default-features = false, features = ["system-fonts", "text"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sevenz-rust = { version = "=0.6.1", default-features = false }
tauri = { version = "2", features = ["tray-icon"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tokio-util = "0.7"
unrar = "=0.5.8"
windows = { version = "0.62", features = [
  "Win32_Graphics_Imaging",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_UI_Shell",
] }
zip = { version = "6", default-features = false, features = ["deflate"] }

[dev-dependencies]
sevenz-rust = { version = "=0.6.1", default-features = false, features = ["compress"] }
