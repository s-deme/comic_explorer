name: Windows packages

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.18.0"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate release SBOM
        run: python scripts/prepare-release.py

      - name: Build Windows NSIS installer
        run: npm run tauri -- build --bundles nsis

      - name: Prepare portable package
        shell: pwsh
        run: |
          $portableRoot = Join-Path $PWD "dist\portable"
          New-Item -ItemType Directory -Force -Path $portableRoot | Out-Null
          Copy-Item -LiteralPath "src-tauri\target\release\comic-explorer.exe" -Destination $portableRoot
          Copy-Item -LiteralPath "THIRD-PARTY-NOTICES.md" -Destination $portableRoot
          Copy-Item -LiteralPath "dist\SBOM.json" -Destination $portableRoot

      - name: Upload installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: comic-explorer-windows-installer-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload portable ZIP artifact
        uses: actions/upload-artifact@v6
        with:
          name: comic-explorer-windows-portable-${{ github.sha }}
          path: dist/portable/
          if-no-files-found: error
          retention-days: 14
