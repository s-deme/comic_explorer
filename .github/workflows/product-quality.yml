name: Product quality

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:bundle

  rust:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - run: python ../tests/fixtures/generate_fixtures.py --force
      - run: python ../tests/fixtures/validate_fixtures.py ../tests/fixtures/generated
      - run: New-Item -ItemType Directory -Force dist | Out-Null
        working-directory: .
      - run: cargo metadata --manifest-path src-tauri/Cargo.toml --locked --format-version 1 > dist/cargo-metadata.json
        working-directory: .
      - run: python scripts/generate-sbom.py
        working-directory: .
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: rustup component add rustfmt
      - run: cargo fmt --check
      - run: cargo check --locked
      - run: cargo test --locked
