name: Product quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # actions/setup-node@v5
        with:
          node-version: "24.18.0"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:bundle

  rust:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # actions/checkout@v5
        with:
          persist-credentials: false
      - run: python ../tests/fixtures/generate_fixtures.py --force
      - run: python ../tests/fixtures/validate_fixtures.py ../tests/fixtures/generated
      - run: New-Item -ItemType Directory -Force dist | Out-Null
        working-directory: .
      - run: cargo metadata --manifest-path src-tauri/Cargo.toml --locked --format-version 1 > dist/cargo-metadata.json
        working-directory: .
      - run: python scripts/generate-sbom.py
        working-directory: .
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: rustup component add rustfmt
      - name: Make bundled Perl available for AVIF build
        shell: pwsh
        run: |
          $gitRoot = Split-Path (Split-Path (Get-Command git.exe).Source)
          Join-Path $gitRoot 'usr\bin' | Out-File -FilePath $env:GITHUB_PATH -Append
      - run: cargo fmt --check
      - run: cargo check --locked
      - run: cargo test --locked
